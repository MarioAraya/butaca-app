kind: pipeline
type: docker
name: backend

trigger:
  branch:
    - main
  event:
    - push
  paths:
    exclude:
      - frontend/**

dns:
  - 8.8.8.8
  - 1.1.1.1

steps:
  - name: build-and-push
    image: plugins/docker
    settings:
      registry: 192.168.0.103:5000
      repo: 192.168.0.103:5000/maaya/que-ver-cine-hoy
      insecure: true
      tags:
        - latest
        - ${DRONE_COMMIT_SHA:0:8}

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host: 192.168.0.104
      username: maaya
      key:
        from_secret: ssh_key
      script:
        - mkdir -p ~/cine/data
        - docker pull 192.168.0.103:5000/maaya/que-ver-cine-hoy:latest
        - docker stop que-ver-cine-hoy-api || true
        - docker rm que-ver-cine-hoy-api || true
        - docker run -d --name que-ver-cine-hoy-api
            --network traefik-net
            --restart unless-stopped
            --label "traefik.enable=true"
            --label "traefik.http.routers.cine-api.rule=Host(\`cine-api.lab\`)"
            --label "traefik.http.routers.cine-api.entrypoints=web"
            --label "traefik.http.services.cine-api.loadbalancer.server.port=8000"
            -v $HOME/cine/data:/app/data
            --env-file $HOME/cine/.env
            192.168.0.103:5000/maaya/que-ver-cine-hoy:latest

---
kind: pipeline
type: docker
name: frontend

trigger:
  branch:
    - main
  event:
    - push
  paths:
    - frontend/**

dns:
  - 8.8.8.8
  - 1.1.1.1

steps:
  - name: build-and-push
    image: plugins/docker
    settings:
      registry: 192.168.0.103:5000
      repo: 192.168.0.103:5000/maaya/que-ver-cine-hoy-frontend
      insecure: true
      tags:
        - latest
        - ${DRONE_COMMIT_SHA:0:8}
      context: frontend
      dockerfile: frontend/Dockerfile
      build_args:
        - VITE_API_URL=http://cine-api.lab

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host: 192.168.0.104
      username: maaya
      key:
        from_secret: ssh_key
      script:
        - docker pull 192.168.0.103:5000/maaya/que-ver-cine-hoy-frontend:latest
        - docker stop que-ver-cine-hoy-frontend || true
        - docker rm que-ver-cine-hoy-frontend || true
        - docker run -d --name que-ver-cine-hoy-frontend
            --network traefik-net
            --restart unless-stopped
            --label "traefik.enable=true"
            --label "traefik.http.routers.cine.rule=Host(\`cine.lab\`)"
            --label "traefik.http.routers.cine.entrypoints=web"
            --label "traefik.http.services.cine.loadbalancer.server.port=80"
            192.168.0.103:5000/maaya/que-ver-cine-hoy-frontend:latest
