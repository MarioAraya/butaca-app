server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|ico|webmanifest|woff2?)$ {
        access_log off;
        try_files $uri =404;
    }

    location = /sw.js {
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
